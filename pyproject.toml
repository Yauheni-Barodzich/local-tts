[project]
name = "ltts"
version = "0.1.0"
description = "Локальный синтез речи (Silero, Piper, RHVoice): CLI для агентов, MCP, OpenAI-совместимый API и веб-морда"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "piper-tts>=1.3",
    "torch>=2.2",
    "numpy",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "num2words>=0.5.14",
    "soxr>=1.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10.0"]
desktop = ["pystray>=0.19", "Pillow>=10.0", "pywebview>=5.0"]

[project.scripts]
ltts = "ltts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # en-core-web-sm нет на PyPI, только релизы spaCy на GitHub

[tool.hatch.build.targets.wheel]
packages = ["src/ltts"]

[tool.hatch.build.targets.wheel.force-include]
"src/ltts/assets/logo.svg" = "ltts/assets/logo.svg"
"src/ltts/assets/app.ico" = "ltts/assets/app.ico"
"src/ltts/assets/app.png" = "ltts/assets/app.png"
"src/ltts/assets/tray.ico" = "ltts/assets/tray.ico"
"src/ltts/assets/tray.png" = "ltts/assets/tray.png"
"src/ltts/web/favicon.svg" = "ltts/web/favicon.svg"
"src/ltts/web/favicon.ico" = "ltts/web/favicon.ico"
"src/ltts/web/favicon.png" = "ltts/web/favicon.png"
"src/ltts/web/setup.html" = "ltts/web/setup.html"

# на Linux берём CPU-сборку torch, иначе приедет CUDA на гигабайты
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
