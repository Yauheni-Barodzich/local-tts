<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ltts avatar</title>
<script src="/avatar-chroma.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #010102 !important;
    background-color: #010102 !important;
    color-scheme: light;
    cursor: move;
  }
  html.preview, html.preview body {
    background: transparent !important;
    background-color: transparent !important;
    cursor: default;
  }
  #preview-grid {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: repeating-conic-gradient(#cbd5e1 0% 25%, #f1f5f9 0% 50%) 50% / 14px 14px;
  }
  html.preview #preview-grid { display: block; }
  @media (prefers-color-scheme: dark) {
    html.preview #preview-grid {
      background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 14px 14px;
    }
  }
  html, body, #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #dragpad {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #010102;
  }
  html.preview #dragpad {
    background: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
    visibility: hidden;
    background: transparent;
    pointer-events: none;
  }
  #stage.live { visibility: visible; }
  #stage img, #stage canvas { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; display: block; }
  #rig { position: absolute; inset: 0; background: transparent; }
  #rig canvas { width: 100%; height: 100%; background: transparent; }
  #single {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    object-position: bottom center;
    transform-origin: center bottom;
  }
  #single-cv {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div id="preview-grid" aria-hidden="true"></div>
<div id="dragpad" class="pywebview-drag-region" aria-hidden="true"></div>
<div id="stage">
  <img id="single" alt="" hidden>
  <canvas id="single-cv" hidden></canvas>
  <div id="rig" hidden><canvas id="cv"></canvas></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage");
let cfg = { mode: "bundled" };
let manifest = null;
let mouthImgs = {};
let baseImg = null;
let singleImg = null;
let blink = false;
let blinkT = 0;
let statusPoll = null;
let animPoll = null;
let playing = false;
let configLoaded = false;
let alwaysOn = false;

const _qs = new URLSearchParams(location.search);
const previewMode = _qs.has("preview") || _qs.get("preview") === "1";
if (previewMode) {
  document.documentElement.classList.add("preview");
  $("dragpad").style.display = "none";
}

function chromaLayout() {
  return window.AvatarChroma.parseChromaLayout(cfg.layout || {});
}

function applyPageChroma() {
  window.AvatarChroma.applyPageBackground(cfg.layout || {}, previewMode);
}

function useChromaCanvas() {
  return chromaLayout().enabled;
}

async function loadConfig() {
  cfg = await fetch("/api/avatar/config").then((r) => r.json());
  applyPageChroma();
  if (cfg.mode === "rig" && cfg.rig_url) {
    manifest = await fetch(cfg.rig_url).then((r) => r.json());
    baseImg = await loadImg(manifest.base);
    mouthImgs = {};
    for (const [k, url] of Object.entries(manifest.mouths || {})) {
      mouthImgs[k] = await loadImg(url);
    }
    $("single").hidden = true;
    $("single-cv").hidden = true;
    $("rig").hidden = false;
    singleImg = null;
  } else {
    manifest = null;
    baseImg = null;
    const url = (
      cfg.mode === "bundled" ? cfg.bundled_url : (cfg.image_url || cfg.bundled_url)
    ) + "?t=" + Date.now();
    try {
      singleImg = await loadImg(url);
    } catch (_) {
      await showBundledFallback();
      configLoaded = true;
      return;
    }
    $("rig").hidden = true;
    syncSingleView();
  }
  configLoaded = true;
  if (manifest) drawRig({ playing: false, level: 0, viseme: "closed" });
  else drawSingle();
}

function syncSingleView() {
  if (useChromaCanvas()) {
    $("single").hidden = true;
    $("single-cv").hidden = false;
    drawSingle();
  } else {
    $("single-cv").hidden = true;
    const el = $("single");
    el.onerror = () => { showBundledFallback().catch(() => {}); };
    if (singleImg) el.src = singleImg.src;
    el.hidden = false;
    applySingleLayout();
  }
}

function layoutCfg() {
  const L = cfg.layout || {};
  return {
    fit: L.fit === "contain" ? "contain" : "cover",
    scale: Number(L.scale) > 0 ? Number(L.scale) : 1,
    offset_x: Number(L.offset_x) || 0,
    offset_y: Number(L.offset_y) || 0,
  };
}

function fitScale(w, h, iw, ih, fit) {
  if (!iw || !ih) return 1;
  return fit === "cover" ? Math.max(w / iw, h / ih) : Math.min(w / iw, h / ih);
}

function layoutDrawRect(w, h, source) {
  const L = layoutCfg();
  const scale = fitScale(w, h, source.width, source.height, L.fit) * L.scale;
  const bw = source.width * scale;
  const bh = source.height * scale;
  const ox = (w - bw) / 2 + L.offset_x;
  const oy = h - bh + L.offset_y;
  return { ox, oy, bw, bh };
}

function applySingleLayout() {
  const el = $("single");
  if (el.hidden) return;
  const L = layoutCfg();
  el.style.objectFit = L.fit;
  el.style.objectPosition = "bottom center";
  el.style.transformOrigin = "center bottom";
  el.style.transform = `translate(${L.offset_x}px, ${L.offset_y}px) scale(${L.scale})`;
}

function drawSingle() {
  if (manifest || !singleImg) return;
  if (!chromaLayout().enabled) {
    $("single-cv").hidden = true;
    const el = $("single");
    el.onerror = () => { showBundledFallback().catch(() => {}); };
    el.src = singleImg.src;
    el.hidden = false;
    applySingleLayout();
    return;
  }
  $("single").hidden = true;
  $("single-cv").hidden = false;
  const w = stage.clientWidth || 160;
  const h = stage.clientHeight || 160;
  const cv = $("single-cv");
  cv.width = w;
  cv.height = h;
  const g = cv.getContext("2d", { alpha: true });
  g.clearRect(0, 0, w, h);
  const { ox, oy, bw, bh } = layoutDrawRect(w, h, singleImg);
  g.drawImage(singleImg, ox, oy, bw, bh);
  try {
    window.AvatarChroma.chromaKeyLayoutRect(g, 0, 0, w, h, cfg.layout || {});
  } catch (e) {
    console.warn("avatar chroma:", e);
  }
}

function loadImg(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    const abs = new URL(url, location.href);
    if (abs.origin !== location.origin) i.crossOrigin = "anonymous";
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = url;
  });
}

function chromaKeyBaseRegion(g, w, h, ox, oy, bw, bh) {
  if (!chromaLayout().enabled) return;
  const x0 = Math.max(0, Math.floor(ox));
  const y0 = Math.max(0, Math.floor(oy));
  const x1 = Math.min(w, Math.ceil(ox + bw));
  const y1 = Math.min(h, Math.ceil(oy + bh));
  if (x1 > x0 && y1 > y0) {
    window.AvatarChroma.chromaKeyLayoutRect(g, x0, y0, x1 - x0, y1 - y0, cfg.layout || {});
  }
}

function drawRig(st) {
  const cv = $("cv");
  const wrap = $("rig");
  const w = wrap.clientWidth || 160;
  const h = wrap.clientHeight || 184;
  cv.width = w;
  cv.height = h;
  const g = cv.getContext("2d", { alpha: true });
  g.clearRect(0, 0, w, h);
  if (!baseImg) return;
  const { ox, oy, bw, bh } = layoutDrawRect(w, h, baseImg);
  g.drawImage(baseImg, ox, oy, bw, bh);
  chromaKeyBaseRegion(g, w, h, ox, oy, bw, bh);
  if (!st.playing) return;
  const mouth = manifest?.mouth || { x: 0.35, y: 0.55, w: 0.3, h: 0.12 };
  let vis = st.viseme || "closed";
  if (st.level < 0.04) vis = "closed";
  else if (st.level > 0.08 && mouthImgs[vis]) { /* server viseme */ }
  else vis = st.level > 0.45 ? "O" : st.level > 0.2 ? "E" : "closed";
  const m = mouthImgs[vis] || mouthImgs.closed;
  if (m) {
    const mx = ox + mouth.x * bw;
    const my = oy + mouth.y * bh;
    const mw = mouth.w * bw;
    const mh = mouth.h * bh;
    const open = 0.35 + st.level * 0.65;
    g.drawImage(m, mx, my, mw, mh * open);
  }
  if (blink) {
    g.fillStyle = "rgba(15,23,42,0.35)";
    const ey = manifest?.eyes;
    if (ey) g.fillRect(ox + ey.x * bw, oy + ey.y * bh, ey.w * bw, ey.h * bh);
  }
}

function setAnimPoll(on) {
  if (on && !animPoll) {
    animPoll = setInterval(pollAnimFrame, 50);
  } else if (!on && animPoll) {
    clearInterval(animPoll);
    animPoll = null;
  }
}

async function pollAnimFrame() {
  if (!playing || !manifest) return;
  try {
    const st = await fetch("/api/avatar/playback").then((r) => r.json());
    playing = !!st.playing;
    if (!playing) {
      setAnimPoll(false);
      return;
    }
    drawRig(st);
    const now = performance.now();
    if (now - blinkT > 2800 + Math.random() * 2000) {
      blink = true;
      blinkT = now;
      setTimeout(() => { blink = false; }, 120);
    }
  } catch (_) {}
}

async function pollPlayback() {
  try {
    const st = await fetch("/api/avatar/playback").then((r) => r.json());
    const was = playing;
    playing = !!st.playing;
    stage.classList.toggle("live", alwaysOn || playing);
    if (playing && !was && !configLoaded) await loadConfig();
    setAnimPoll(playing);
    if (playing && !was && manifest) drawRig(st);
  } catch (_) {}
}

async function showBundledFallback() {
  singleImg = await loadImg("/assets/avatar-default.png?t=" + Date.now());
  manifest = null;
  baseImg = null;
  $("rig").hidden = true;
  applyPageChroma();
  syncSingleView();
  stage.classList.add("live");
}

alwaysOn = _qs.has("always") || _qs.get("always") === "1";
if (alwaysOn) {
  stage.classList.add("live");
  loadConfig().catch(() => showBundledFallback());
}

function redrawAvatarFrame() {
  if (!configLoaded) return;
  if (manifest) drawRig({ playing: false, level: 0, viseme: "closed" });
  else drawSingle();
}

if (previewMode || alwaysOn) {
  window.addEventListener("resize", () => redrawAvatarFrame());
}

statusPoll = setInterval(pollPlayback, 250);
window.addEventListener("beforeunload", () => {
  if (statusPoll) clearInterval(statusPoll);
  if (animPoll) clearInterval(animPoll);
});
</script>
</body>
</html>
