<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ltts — локальный синтез речи</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.png">
<script src="/common.js"></script>
<style>
  /* Minimalism & Swiss: сетка, воздух, контраст. Палитра «waveform blue + recording red». Шрифты системные — офлайн. */
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #E2E8F0; --border-strong: #CBD5E1;
    --text: #0F172A; --muted: #475569; --faint: #64748B;
    --accent: #2563EB; --accent-hover: #1D4ED8; --on-accent: #FFFFFF; --accent-soft: #EFF6FF; --accent-text: #1D4ED8;
    --rec: #DC2626; --ok: #15803D; --warn: #B45309; --warn-soft: #FFFBEB; --bad: #B91C1C; --bad-soft: #FEF2F2;
    --wave: #CBD5E1; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
    --ring: 0 0 0 3px rgba(37, 99, 235, .35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px; --r-sm: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F172A; --surface: #1B2336; --surface-2: #232C40; --border: #2B3549; --border-strong: #3B4659;
      --text: #F8FAFC; --muted: #A5B1C2; --faint: #8391A7;
      --accent: #60A5FA; --accent-hover: #93C5FD; --on-accent: #0F172A; --accent-soft: rgba(96, 165, 250, .12); --accent-text: #93C5FD;
      --rec: #F87171; --ok: #4ADE80; --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .1); --bad: #F87171; --bad-soft: rgba(248, 113, 113, .1);
      --wave: #3B4659; --shadow: 0 1px 2px rgba(0, 0, 0, .4); --ring: 0 0 0 3px rgba(96, 165, 250, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F172A; --surface: #1B2336; --surface-2: #232C40; --border: #2B3549; --border-strong: #3B4659;
    --text: #F8FAFC; --muted: #A5B1C2; --faint: #8391A7;
    --accent: #60A5FA; --accent-hover: #93C5FD; --on-accent: #0F172A; --accent-soft: rgba(96, 165, 250, .12); --accent-text: #93C5FD;
    --rec: #F87171; --ok: #4ADE80; --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .1); --bad: #F87171; --bad-soft: rgba(248, 113, 113, .1);
    --wave: #3B4659; --shadow: 0 1px 2px rgba(0, 0, 0, .4); --ring: 0 0 0 3px rgba(96, 165, 250, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 24px 64px; }

  /* ---------- шапка ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin: -24px -24px 24px; padding: 24px 24px 16px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--text); color: var(--bg); display: grid; place-items: center; position: relative; }
  .logo::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); border: 2px solid var(--bg); }
  .brand h1 { font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  .brand p { margin: 0; font-size: 13px; color: var(--faint); }
  .status { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.ok .dot { background: var(--ok); } .pill.warn .dot { background: var(--warn); } .pill.bad .dot { background: var(--bad); }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); transition: color .15s, border-color .15s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .vol { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); }
  .vol .icon { width: 16px; height: 16px; flex: none; }
  .vol input[type=range] { width: 96px; height: 20px; margin: 0; accent-color: var(--accent); }
  .vol output { font: 12px var(--mono); color: var(--faint); min-width: 2.75em; text-align: right; border: 0; }

  /* ---------- вкладки ---------- */
  .main-tabs { display: flex; gap: 4px; margin-bottom: 20px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .main-tabs button {
    flex: 1; min-height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 600; transition: background .15s, color .15s, box-shadow .15s;
  }
  .main-tabs button:hover { color: var(--text); }
  .main-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .main-tabs .tab-badge { font: 11px var(--mono); font-weight: 500; color: var(--faint); margin-left: 6px; }
  .main-tabs button[aria-selected="true"] .tab-badge { color: var(--accent-text); }
  .tab-panel[hidden] { display: none !important; }
  .tab-panel { min-width: 0; }
  .tab-panel .panel-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab-panel .panel-toolbar h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0; }
  .tab-panel .panel-toolbar .hist-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .tab-panel .panel-toolbar .hist-actions span { font: 13px var(--mono); color: var(--faint); }
  .tab-panel--blocks details.agents { margin-top: 24px; }

  /* ---------- раскладка (вкладка «Блоки») ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; column-gap: 24px; align-items: start; }
  .area-editor { grid-column: 1; } .panel { grid-column: 2; grid-row: 1; align-self: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }

  /* редактор */
  .editor { display: flex; flex-direction: column; }
  .editor textarea { min-height: 260px; resize: vertical; border: 0; outline: 0; background: transparent; padding: 20px 20px 8px;
    font-size: 18px; line-height: 1.6; border-radius: var(--r) var(--r) 0 0; }
  .editor textarea::placeholder { color: var(--faint); }
  .editor:focus-within { border-color: var(--border-strong); }
  .notice { margin: 0 20px 8px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn);
    font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .notice > span { flex: 1 1 200px; }
  .notice button { background: none; border: 0; padding: 0; color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; font-size: 14px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-top: 1px solid var(--border); }
  .bar .meta { margin-right: auto; font: 13px var(--mono); color: var(--faint); }
  kbd { font: 12px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface-2); color: var(--muted); }
  .cta { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background .15s, transform .1s; white-space: nowrap; }
  .cta:hover { background: var(--accent-hover); }
  .cta:active { transform: translateY(1px); }
  .cta[aria-busy="true"] { cursor: progress; opacity: .85; }
  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress { margin: 12px 0 0; padding: 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--muted); }
  .progress .track { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; position: relative; }
  .progress .track::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  .progress time { font: 13px var(--mono); color: var(--faint); }
  .error { margin-top: 12px; padding: 12px 16px; border-radius: var(--r); background: var(--bad-soft); color: var(--bad); font-size: 14px;
    display: flex; gap: 10px; align-items: flex-start; white-space: pre-wrap; border: 1px solid transparent; }

  /* панель настроек */
  .panel { padding: 20px; display: grid; gap: 20px; position: sticky; top: 88px; }
  .field > .label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--muted);
    margin-bottom: 8px; letter-spacing: .01em; }
  .field > .label output, .field > .label span { font: 13px var(--mono); font-weight: 400; color: var(--faint); }
  .seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    font-size: 14px; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

  .voices { max-height: 340px; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; }
  .group-title { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 8px 2px 6px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
  .group-title small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--warn); }
  .voice { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px; border-radius: var(--r-sm);
    border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; }
  .voice:hover { background: var(--surface-2); }
  .voice:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
  .voice:has(input:focus-visible) { box-shadow: var(--ring); }
  .voice:has(input:disabled) { opacity: .5; cursor: not-allowed; }
  .voice input { position: absolute; opacity: 0; pointer-events: none; }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-strong); flex: none; display: grid; place-items: center; }
  .voice:has(input:checked) .radio { border-color: var(--accent); }
  .voice:has(input:checked) .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .voice .name { font: 500 14px var(--mono); }
  .voice .tags { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); }
  .tag { padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 500; }
  .tag.def { background: var(--accent-soft); color: var(--accent-text); }
  .tag.dl { color: var(--faint); display: inline-flex; align-items: center; gap: 3px; }
  .tag.dl .icon { width: 12px; height: 12px; }
  .empty-voices { padding: 16px 8px; font-size: 14px; color: var(--faint); text-align: center; }
  .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .label-row .label { margin: 0; }
  .link-btn { display: inline-flex; gap: 4px; align-items: center; min-height: 32px; background: none; border: 0; padding: 4px 8px; border-radius: 8px;
    color: var(--accent-text); font-size: 13px; font-weight: 600; transition: background .15s; }
  .link-btn:hover { background: var(--accent-soft); }
  .link-btn .icon { width: 15px; height: 15px; }
  .voice .del { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; color: var(--faint); border-radius: 6px; flex: none; }
  .voice .del:hover { color: var(--bad); background: var(--bad-soft); }
  .voice .del .icon { width: 15px; height: 15px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 24px; }
  .range-scale { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--faint); margin-top: -2px; }

  /* история / диск */
  .ghost.danger:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .history { display: grid; gap: 12px; }
  .clip { padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 16px; align-items: center; }
  .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
    transition: background .15s, transform .1s; }
  .play:hover { background: var(--accent-hover); }
  .play:active { transform: scale(.96); }
  .play .icon { width: 18px; height: 18px; }
  .play svg.icon[data-i="play"] { fill: currentColor; margin-left: 2px; }
  .play svg.icon[data-i="pause"] { fill: currentColor; }
  .wave { position: relative; height: 44px; cursor: pointer; border-radius: 6px; }
  .wave canvas { width: 100%; height: 100%; display: block; }
  .clip .text { grid-column: 1 / -1; font-size: 15px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clip .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .clip .info { font: 12px var(--mono); color: var(--faint); margin-right: auto; display: flex; gap: 6px 12px; flex-wrap: wrap; }
  .clip .info b { color: var(--muted); font-weight: 500; }
  .clip .info .swap { color: var(--warn); }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 13px; text-decoration: none; transition: color .15s, border-color .15s; }
  .ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .ghost .icon { width: 15px; height: 15px; }
  .empty { padding: 32px 20px; text-align: center; color: var(--faint); font-size: 14px; }
  .empty .icon { width: 28px; height: 28px; color: var(--border-strong); margin-bottom: 8px; }
  .out-dir { font: 12px var(--mono); color: var(--faint); margin: -4px 0 12px; word-break: break-all; }
  .out-list { padding: 0; overflow: hidden; max-height: min(70vh, 640px); overflow-y: auto; scrollbar-width: thin; }
  .tab-panel--history .history { max-height: min(70vh, 720px); overflow-y: auto; scrollbar-width: thin; padding-right: 2px; }
  .out-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .out-row:last-child { border-bottom: 0; }
  .out-row .name { flex: 1 1 160px; font: 13px var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .out-row .meta { font: 12px var(--mono); color: var(--faint); white-space: nowrap; }
  .out-row .actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .play-sm { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  .play-sm:hover { background: var(--accent); color: var(--on-accent); }
  .play-sm .icon { width: 16px; height: 16px; }
  .play-sm svg.icon[data-i="play"] { fill: currentColor; margin-left: 1px; }

  details.voices-panel {
    border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface-2);
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  details.voices-panel[open] { background: var(--surface); border-color: var(--border-strong); box-shadow: var(--shadow); }
  details.voices-panel summary { cursor: pointer; list-style: none; user-select: none; margin-bottom: 0 !important; }
  details.voices-panel summary::-webkit-details-marker { display: none; }
  details.voices-panel .voices-summary {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px;
    border-radius: 6px; padding: 2px 4px; margin: -2px -4px; transition: background .15s, color .15s;
  }
  details.voices-panel summary:hover .voices-summary { background: var(--accent-soft); color: var(--text); }
  details.voices-panel summary:focus-visible .voices-summary { box-shadow: var(--ring); }
  details.voices-panel .voices-summary .chevron { width: 16px; height: 16px; flex: none; color: var(--accent-text); transition: transform .2s ease; }
  details.voices-panel[open] .voices-summary .chevron { transform: rotate(180deg); }
  details.voices-panel .voices-hint-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  details.voices-panel .voices-hint { font-size: 12px; font-weight: 500; color: var(--faint); white-space: nowrap; }
  details.voices-panel[open] .voices-hint { color: var(--muted); }
  details.voices-panel[open] .voices-hint-show { display: none; }
  details.voices-panel:not([open]) .voices-hint-hide { display: none; }
  details.voices-panel .voice-picked { flex: 1 1 120px; min-width: 0; font: 500 13px var(--mono); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.voices-panel .voice-picked.empty { color: var(--faint); font-weight: 400; }
  details.voices-panel[open] .voice-picked { display: none; }
  details.voices-panel:not([open]) .voices-summary { flex-wrap: wrap; row-gap: 4px; }
  details.voices-panel[open] .voices { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  details.agents { margin-top: 32px; }
  details.agents summary { cursor: pointer; display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; list-style: none;
    border-radius: 8px; padding: 4px 8px; margin: -4px -8px; transition: background .15s, color .15s; }
  details.agents summary:hover { background: var(--surface-2); color: var(--text); }
  details.agents summary::-webkit-details-marker { display: none; }
  details.agents summary .chevron { width: 16px; height: 16px; flex: none; transition: transform .2s ease; }
  details.agents[open] summary .chevron { transform: rotate(180deg); }
  details.agents pre { margin: 12px 0 0; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border);
    font: 13px/1.6 var(--mono); color: var(--muted); overflow-x: auto; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .area-editor { grid-column: 1; }
    .panel { grid-column: 1; grid-row: auto; position: static; margin-top: 16px; }
    .voices { max-height: 300px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 16px 16px 48px; }
    .brand p { display: none; }
    header { gap: 12px; margin: -16px -16px 20px; padding: 16px 16px 12px; }
    .status { order: 3; width: 100%; }
    .editor textarea { min-height: 180px; padding: 16px; font-size: 17px; }
    .bar { padding: 12px; flex-wrap: wrap; }
    .bar .hint { display: none; }
    .cta { flex: 1; justify-content: center; }
    .notice { margin: 0 16px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="icon" data-i="wave"></svg></div>
      <div><h1>ltts</h1><p>Локальный синтез речи · ничего не уходит в интернет</p></div>
    </div>
    <div class="status" id="engines" aria-label="Состояние движков"></div>
    <div class="vol" title="Громкость воспроизведения">
      <svg class="icon" data-i="volume" aria-hidden="true"></svg>
      <label for="volume" class="sr-only">Громкость</label>
      <input id="volume" type="range" min="0" max="100" step="1" value="50" aria-valuetext="50%">
      <output id="volumeOut" for="volume">50%</output>
    </div>

<script>
// ---------- иконки (Lucide, MIT) ----------
const ICONS = {

const icon = (name, cls = "") => `<svg class="icon ${cls}" data-i="${name}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
function hydrateIcons(root = document) {
  root.querySelectorAll("svg.icon[data-i]:not([viewBox])").forEach((s) => {
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.innerHTML = ICONS[s.dataset.i];

hydrateIcons();

const $ = (id) => document.getElementById(id);
if ($("openSettings")) $("openSettings").innerHTML = icon("settings");
const store = {
  get(k, d) { try { const v = localStorage.getItem("ltts." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ltts." + k, JSON.stringify(v)); } catch {} },
};

const MAIN_TABS = ["blocks", "history", "disk"];
function switchMainTab(name) {
  if (!MAIN_TABS.includes(name)) name = "blocks";
  document.querySelectorAll(".main-tabs [role=tab]").forEach((t) => {
    const on = t.dataset.tab === name;
    t.setAttribute("aria-selected", String(on));
    t.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll(".tab-panel").forEach((p) => { p.hidden = p.dataset.tab !== name; });
  store.set("mainTab", name);
}
function updateTabBadges() {
  const hb = $("tabHistBadge"), db = $("tabDiskBadge");
  if (hb) {
    hb.textContent = clips.length ? String(clips.length) : "";
    hb.hidden = !clips.length;
  }
  if (db) {
    db.textContent = outFiles.length ? String(outFiles.length) : "";
    db.hidden = !outFiles.length;
  }
}
document.querySelectorAll(".main-tabs [role=tab]").forEach((btn) => {
  btn.addEventListener("click", () => switchMainTab(btn.dataset.tab));
  btn.addEventListener("keydown", (e) => {
    const i = MAIN_TABS.indexOf(btn.dataset.tab);
    if (e.key === "ArrowRight") { e.preventDefault(); switchMainTab(MAIN_TABS[(i + 1) % MAIN_TABS.length]); document.getElementById(`tab-${MAIN_TABS[(i + 1) % MAIN_TABS.length]}`)?.focus(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); switchMainTab(MAIN_TABS[(i + MAIN_TABS.length - 1) % MAIN_TABS.length]); document.getElementById(`tab-${MAIN_TABS[(i + MAIN_TABS.length - 1) % MAIN_TABS.length]}`)?.focus(); }
  });
});
switchMainTab(MAIN_TABS.includes(store.get("mainTab", "blocks")) ? store.get("mainTab", "blocks") : "blocks");
const ENGINE_LABELS = { silero: "Silero", piper: "Piper", rhvoice: "RHVoice" };
const engineLabel = (n) => ENGINE_LABELS[n] || state.engines[n]?.title || n;
const catalogEngines = () => Object.keys(state.engines);
const FIRST_USE = {};
const LANG_NAMES = { ru: "русском", en: "английском", de: "немецком" };
const LANG_SHOW = { ru: "русские", en: "английские", de: "немецкие" };
// те же правила, что на сервере (ltts/text.py): кириллица -> ru; латиница -> de по умлаутам и служебным словам, иначе en
const DE_WORDS = new Set("und der die das ist nicht ich du er sie es wir ihr mit auf für von zu den dem des ein eine einen einem eines auch sich noch nur wie wenn aber oder so schon kann muss mehr sehr hier dann jetzt heute bitte danke ja nein gut ganz habe hat haben sind bin war waren wird werden wurde mein dein sein unser über nach bei aus um vor durch ohne gegen weil dass als wo was wer warum doch mal immer wieder".split(" "));
const EN_WORDS = new Set("the and is are was were be been to of in on at for with that this it you he she we they not have has had do does did will would can could should a an or but if then so just very here there what who why how my your our their from by as about into over after before because which when where".split(" "));
const GENDER = { female: "жен.", male: "муж." };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
document.querySelector(".hint kbd").textContent = isMac ? "⌘" : "Ctrl";

const state = {
  voices: [], defaults: {}, engines: {},
  lang: store.get("lang", "ru"), gender: store.get("gender", "all"), format: store.get("format", "wav"),
};

// ---------- тема: авто → светлая → тёмная ----------
const THEMES = [["auto", "Тема: как в системе"], ["light", "Тема: светлая"], ["dark", "Тема: тёмная"]];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const label = THEMES.find(([k]) => k === t)[1];
  $("theme").innerHTML = icon(t === "auto" ? "auto" : t === "light" ? "sun" : "moon");
  $("theme").setAttribute("aria-label", label); $("theme").title = label;
}
let theme = store.get("theme", "auto");
applyTheme(theme);
$("theme").onclick = () => { theme = THEMES[(THEMES.findIndex(([k]) => k === theme) + 1) % 3][0]; store.set("theme", theme); applyTheme(theme); redrawAll(); };

// ---------- сегментированные переключатели ----------
function bindSeg(id, key, onChange) {
  const seg = $(id);
  const sync = () => seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state[key])));
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.dataset.v === state[key]) return;
    state[key] = b.dataset.v; store.set(key, state[key]); sync(); onChange?.();
  });
  sync();
  return sync;
}
const syncLang = bindSeg("langSeg", "lang", () => { renderVoices(); updateHint(); });
bindSeg("genderSeg", "gender", renderVoices);
bindSeg("formatSeg", "format");

// ---------- данные ----------
async function load() {
  const [v, s] = await Promise.all(["/api/voices", "/api/status"].map((u) => fetch(u).then((r) => r.json())));
  Object.assign(state, { voices: v.voices, defaults: v.defaults, engines: s.engines });
  renderEngines(); renderVoices();
}
const engineState = (n) => {
  const e = state.engines[n];
  if (!e) return "ok";
  return e.ok ? "ok" : e.installable ? "warn" : "bad";
};

function renderEngines() {
  const label = { ok: "работает", warn: "соберётся при первом использовании", bad: "недоступен" };
  $("engines").innerHTML = Object.keys(state.engines).map((n) => {
    const st = engineState(n), e = state.engines[n];
    const title = (e.hint || label[st]).replace(/"/g, "&quot;");
    return `<span class="pill ${st}" title="${title}"><span class="dot" aria-hidden="true"></span>${engineLabel(n)}<span class="sr-only">: ${label[st]}</span></span>`;
  }).join("");
}

function selectedVoice() { return document.querySelector('#voices input[name="voice"]:checked'); }

function updateVoicePicked() {
  const el = $("voicePicked");
  if (!el) return;
  const input = selectedVoice();
  if (!input) {
    el.textContent = "Голос не выбран";
    el.classList.add("empty");
    el.removeAttribute("title");
    return;
  }
  const v = state.voices.find((x) => x.id === input.value);
  const name = v?.name || input.closest(".voice")?.querySelector(".name")?.textContent || input.value;
  const label = v ? `${engineLabel(v.engine)} · ${name}` : name;
  el.textContent = label;
  el.classList.remove("empty");
  el.title = v ? `${v.id} — ${name}` : name;
}

function renderVoices() {
  const box = $("voices");
  const { lang, gender } = state;
  const def = state.defaults[lang];
  const saved = store.get("voice." + lang, def);
  let html = "", total = 0;
  const pass = (v) => gender === "all" || v.gender === gender;
  for (const eng of catalogEngines()) {
    const list = state.voices.filter((v) => v.engine === eng && v.lang === lang && pass(v));
    if (!list.length) continue;
    const st = engineState(eng);
    const note = st === "warn" ? "<small>соберётся ~2 мин</small>" : "";
    html += `<div class="group-title">${engineLabel(eng)}${note}</div>`;
    for (const v of list) {
      total++;
      const pending = st === "warn" ? "build" : v.installed ? "" : "download";
      const tags = [
        v.id === def ? '<span class="tag def">по умолч.</span>' : "",
        pending ? `<span class="tag dl" title="${pending === "build" ? "Соберётся при первом использовании" : "Скачается при первом использовании"}">${icon(pending === "build" ? "build" : "download")}${pending === "build" ? "сборка" : "скачать"}</span>` : "",
        v.gender ? `<span>${GENDER[v.gender]}</span>` : "",
      ].join("");
      html += `<label class="voice"><input type="radio" name="voice" value="${v.id}" data-pending="${pending}" ${st === "bad" ? "disabled" : ""}>
        <span class="radio" aria-hidden="true"></span><span class="name">${v.name}</span><span class="tags">${tags}</span></label>`;
    }
  }
  box.innerHTML = html || '<div class="empty-voices">Нет голосов под этот фильтр</div>';
  $("voiceCount").textContent = total ? String(total) : "";
  const inputs = [...box.querySelectorAll("input:not(:disabled)")];
  const pick = inputs.find((i) => i.value === saved) || inputs.find((i) => i.value === def) || inputs[0];
  if (pick) {
    pick.checked = true;
    // прокручиваем только список голосов, не страницу
    const row = pick.closest(".voice"), top = row.offsetTop - box.offsetTop;
    if (top < box.scrollTop || top + row.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = top - box.clientHeight / 2;
  }
  updateVoicePicked();
}
$("voices").addEventListener("change", (e) => {
  if (e.target.name === "voice") {
    store.set("voice." + state.lang, e.target.value);
    updateVoicePicked();
  }
});

// ---------- подсказка про язык ----------
function detectLang(text) {
  const cyr = (text.match(/[А-Яа-яЁё]/g) || []).length, lat = (text.match(/[A-Za-zÄÖÜäöüß]/g) || []).length;
  if (!cyr && !lat) return null;
  if (!lat || cyr * 10 >= lat) return "ru";
  const words = (text.toLowerCase().match(/[a-zäöüß']+/g) || []);
  const de = words.filter((w) => DE_WORDS.has(w)).length + 2 * (text.match(/[äöüÄÖÜß]/g) || []).length;
  const en = words.filter((w) => EN_WORDS.has(w)).length;
  return de > en ? "de" : "en";
}
function updateHint() {
  const hint = $("hint"), detected = detectLang($("text").value);
  if (!detected || detected === state.lang) { hint.hidden = true; return; }
  hint.innerHTML = `${icon("alert")}<span>Текст на ${LANG_NAMES[detected]} — голос подберётся сам.</span><button type="button">Показать ${LANG_SHOW[detected]} голоса</button>`;
  hint.querySelector("button").onclick = () => { state.lang = detected; store.set("lang", detected); syncLang(); renderVoices(); updateHint(); };
  hint.hidden = false;
}
function updateCount() { const n = $("text").value.length; $("count").textContent = `${n} ${n % 10 === 1 && n % 100 !== 11 ? "символ" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? "символа" : "символов"}`; }

// ---------- громкость (clips + out) ----------
const DEFAULT_VOLUME = 0.5;
let gainVolume = Math.min(1, Math.max(0, Number(store.get("volume", DEFAULT_VOLUME)) || DEFAULT_VOLUME));

function applyGainAll() {
  clips.forEach((c) => { if (c.audio) c.audio.volume = gainVolume; });
  if (outAudio) outAudio.volume = gainVolume;
}

/** Сигнал desktop: трей, аватар, viseme (pywebview). */
function wireTrayPlayback(audio, speechMeta) {
  if (!audio || audio._lttsTrayWired) return;
  audio._lttsTrayWired = true;
  let tracked = false;
  let levelTimer = null;
  let analyser = null;
  let srcNode = null;
  const api = () => window.pywebview?.api;
  const notify = (d) => { try { api()?.playback_delta?.(d); } catch (_) {} };
  const notifyLevel = (v) => { try { api()?.playback_level?.(v); } catch (_) {} };
  const notifySpeech = (text, dur) => { try { api()?.playback_speech?.(text, dur); } catch (_) {} };

  function stopLevelLoop() {
    if (levelTimer) { clearInterval(levelTimer); levelTimer = null; }
    notifyLevel(0);
    try { srcNode?.disconnect(); } catch (_) {}
    srcNode = null;
    analyser = null;
  }

  function startLevelLoop() {
    stopLevelLoop();
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      srcNode = actx.createMediaElementSource(audio);
      srcNode.connect(analyser);
      analyser.connect(actx.destination);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      levelTimer = setInterval(() => {
        if (audio.paused) return;
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / buf.length);
        notifyLevel(Math.min(1, rms * 4));
      }, 50);
    } catch (_) {
      levelTimer = setInterval(() => { if (!audio.paused) notifyLevel(0.35); }, 50);
    }
  }

  const start = () => {
    if (!tracked) {
      tracked = true;
      notify(1);
      const meta = speechMeta || audio._lttsSpeech;
      if (meta?.text && meta.duration) notifySpeech(meta.text, meta.duration);
      startLevelLoop();
    }
  };
  const stop = () => {
    if (tracked) {
      tracked = false;
      notify(-1);
      stopLevelLoop();
      audio._lttsSpeech = null;
    }
  };
  audio.addEventListener("play", start);
  audio.addEventListener("pause", stop);
  audio.addEventListener("ended", stop);
}

function setGain(v) {
  gainVolume = Math.min(1, Math.max(0, v));
  store.set("volume", gainVolume);
  const pct = Math.round(gainVolume * 100);
  const out = $("volumeOut");
  const sl = $("volume");
  if (out) { out.textContent = `${pct}%`; out.setAttribute("aria-valuetext", `${pct}%`); }
  if (sl) { sl.value = String(pct); sl.setAttribute("aria-valuetext", `${pct}%`); }
  applyGainAll();
}

// ---------- история с волной ----------
const clips = [];
let actx;
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

async function peaksFor(blob, n = 160) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const buf = await actx.decodeAudioData(await blob.arrayBuffer());
    const data = buf.getChannelData(0), step = Math.max(1, Math.floor(data.length / n)), out = [];
    for (let i = 0; i < n; i++) {
      let m = 0;
      for (let j = i * step, end = Math.min(data.length, j + step); j < end; j++) m = Math.max(m, Math.abs(data[j]));
      out.push(m);
    }
    const max = Math.max(...out, 0.01);
    return out.map((v) => v / max);
  } catch { return null; }
}

function drawWave(c) {
  const cv = c.canvas, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const played = css.getPropertyValue("--accent").trim(), rest = css.getPropertyValue("--wave").trim();
  const peaks = c.peaks || Array(80).fill(0.15);
  const bar = 2, gap = 2, n = Math.floor(w / (bar + gap)), progress = c.audio.duration ? c.audio.currentTime / c.audio.duration : 0;
  for (let i = 0; i < n; i++) {
    const v = peaks[Math.floor((i / n) * peaks.length)];
    const bh = Math.max(2, v * (h - 4));
    g.fillStyle = i / n < progress ? played : rest;
    g.beginPath(); g.roundRect ? g.roundRect(i * (bar + gap), (h - bh) / 2, bar, bh, 1) : g.rect(i * (bar + gap), (h - bh) / 2, bar, bh); g.fill();
  }
}
function redrawAll() { clips.forEach(drawWave); }
window.addEventListener("resize", redrawAll);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", redrawAll);

function setPlaying(c, on) {
  c.btn.innerHTML = icon(on ? "pause" : "play");
  c.btn.setAttribute("aria-label", on ? "Пауза" : "Воспроизвести");
}

function disposeClip(c) {
  c.audio?.pause();
  if (c.url) URL.revokeObjectURL(c.url);
  c.el = null;
}

function removeClip(c) {
  const i = clips.indexOf(c);
  if (i < 0) return;
  clips.splice(i, 1);
  disposeClip(c);
  renderHistory();
}

function clearHistory() {
  if (!clips.length) return;
  if (!confirm("Удалить все записи из истории?")) return;
  clips.splice(0, clips.length).forEach(disposeClip);
  renderHistory();
}

function renderHistory() {
  const box = $("history");
  $("histCount").textContent = clips.length ? String(clips.length) : "";
  const clearBtn = $("clearHistory");
  clearBtn.hidden = !clips.length;
  if (clips.length) clearBtn.innerHTML = `${icon("trash")}Удалить всё`;
  if (!clips.length) {
    box.innerHTML = `<div class="card empty">${icon("wave")}<div>Здесь появятся озвученные фразы.</div><div>Напишите текст и нажмите «Озвучить» или <kbd>${isMac ? "⌘" : "Ctrl"}</kbd> <kbd>Enter</kbd>.</div></div>`;
    return;
  }
  for (const c of clips) {
    if (c.el) continue;
    const el = document.createElement("article");
    el.className = "card clip";
    const swap = c.meta.requested_voice ? `<span class="swap" title="Выбранный голос не говорит на этом языке">вместо ${c.meta.requested_voice}</span>` : "";
    el.innerHTML = `
      <button class="play" type="button"></button>
      <div class="wave" role="slider" tabindex="0" aria-label="Перемотка" aria-valuemin="0" aria-valuemax="${Math.round(c.meta.duration)}" aria-valuenow="0"><canvas></canvas></div>
      <div class="text"></div>
      <div class="foot">
        <div class="info"><b>${c.meta.voice}</b>${swap}<span>${c.meta.lang}</span><span class="time">0:00 / ${fmtTime(c.meta.duration)}</span><span>синтез ${c.meta.synth_seconds.toFixed(2)} с</span><span>${c.fmt}</span></div>
        <button class="ghost reuse" type="button">${icon("reuse")}В поле</button>
        <a class="ghost" href="${c.url}" download="ltts-${c.meta.voice.replace(":", "-")}.${c.fmt}">${icon("download")}Скачать</a>
        <button class="ghost danger del" type="button">${icon("trash")}Удалить</button>
      </div>`;
    el.querySelector(".text").textContent = c.text;
    Object.assign(c, { el, btn: el.querySelector(".play"), canvas: el.querySelector("canvas"), wave: el.querySelector(".wave"), timeEl: el.querySelector(".time") });
    c.audio = new Audio(c.url);
    wireTrayPlayback(c.audio, { text: c.text, duration: c.meta.duration });
    c.audio.volume = gainVolume;
    setPlaying(c, false);
    let raf;
    const tick = () => { drawWave(c); c.timeEl.textContent = `${fmtTime(c.audio.currentTime)} / ${fmtTime(c.meta.duration)}`; c.wave.setAttribute("aria-valuenow", Math.round(c.audio.currentTime)); if (!c.audio.paused) raf = requestAnimationFrame(tick); };
    c.audio.onplay = () => { pauseAllPlayback(c.audio); setPlaying(c, true); tick(); };
    c.audio.onpause = () => { setPlaying(c, false); cancelAnimationFrame(raf); tick(); };
    c.audio.onended = () => { c.audio.currentTime = 0; tick(); };
    c.btn.onclick = () => { c.audio.volume = gainVolume; c.audio.paused ? c.audio.play() : c.audio.pause(); };
    const seekTo = (t) => { c.audio.currentTime = Math.max(0, Math.min(c.meta.duration, t)); tick(); };
    c.wave.onclick = (e) => { const r = c.wave.getBoundingClientRect(); seekTo(((e.clientX - r.left) / r.width) * c.meta.duration); };
    c.wave.onkeydown = (e) => {
      if (e.key === "ArrowRight") { seekTo(c.audio.currentTime + 2); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { seekTo(c.audio.currentTime - 2); e.preventDefault(); }
      else if (e.key === " " || e.key === "Enter") { c.btn.click(); e.preventDefault(); }
    };
    el.querySelector(".reuse").onclick = () => { $("text").value = c.text; updateCount(); updateHint(); $("text").focus(); };
    el.querySelector(".del").onclick = () => removeClip(c);
  }
  box.replaceChildren(...clips.map((c) => c.el));
  requestAnimationFrame(redrawAll);
  updateTabBadges();
}

// ---------- файлы LTTS_HOME/out (ltts say без -o и т.д.) ----------
let outFiles = [];
let outAudio = new Audio();
wireTrayPlayback(outAudio);
outAudio.volume = gainVolume;
const fmtBytes = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`);
const fmtDate = (ts) => new Date(ts * 1000).toLocaleString(undefined, { dateStyle: "short", timeStyle: "short" });
const outFileUrl = (name) => `/api/out/file/${encodeURIComponent(name)}`;

function pauseAllPlayback(exceptAudio = null) {
  clips.forEach((c) => { if (c.audio && c.audio !== exceptAudio && !c.audio.paused) c.audio.pause(); });
  if (outAudio !== exceptAudio && !outAudio.paused) outAudio.pause();
}

async function clearOutAll() {
  if (!outFiles.length) return;
  if (!confirm(`Удалить все файлы (${outFiles.length}) из каталога out на диске?`)) return;
  const r = await fetch("/api/out", { method: "DELETE" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  outAudio.pause();
  outAudio.removeAttribute("src");
  await loadOutFiles();
}

function renderOutList() {
  const box = $("outList");
  $("outCount").textContent = outFiles.length ? String(outFiles.length) : "";
  $("refreshOut").innerHTML = `${icon("reuse")}Обновить`;
  const clearOutBtn = $("clearOut");
  clearOutBtn.hidden = !outFiles.length;
  if (outFiles.length) clearOutBtn.innerHTML = `${icon("trash")}Удалить всё`;
  if (!outFiles.length) {
    box.innerHTML = `<div class="empty">${icon("download")}<div>Нет файлов в каталоге out.</div><div>Появятся после <code>ltts say</code> без <code>-o</code> или из MCP.</div></div>`;
    return;
  }
  box.innerHTML = outFiles.map((f) => `
    <div class="out-row" data-name="${f.name.replace(/"/g, "&quot;")}">
      <button class="play-sm" type="button" aria-label="Воспроизвести ${f.name}">${icon("play")}</button>
      <span class="name" title="${f.name.replace(/"/g, "&quot;")}">${f.name}</span>
      <span class="meta">${fmtBytes(f.size)} · ${fmtDate(f.mtime)}</span>
      <div class="actions">
        <a class="ghost" href="${outFileUrl(f.name)}" download="${f.name}">${icon("download")}Скачать</a>
        <button class="ghost danger out-del" type="button">${icon("trash")}Удалить</button>
      </div>
    </div>`).join("");
  hydrateIcons(box);
  box.querySelectorAll(".out-row").forEach((row) => {
    const name = row.dataset.name;
    row.querySelector(".play-sm").onclick = () => {
      pauseAllPlayback(outAudio);
      if (outAudio.src.endsWith(encodeURIComponent(name)) && !outAudio.paused) { outAudio.pause(); return; }
      outAudio.volume = gainVolume;
      outAudio.src = outFileUrl(name);
      outAudio.play().catch(() => {});
    };
    row.querySelector(".out-del").onclick = () => deleteOutFile(name).catch((e) => {
      $("err").innerHTML = `${icon("alert")}<span></span>`;
      $("err").querySelector("span").textContent = e.message;
      $("err").hidden = false;
    });
  });
  updateTabBadges();
}

async function loadOutFiles() {
  const r = await fetch("/api/out");
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  const data = await r.json();
  outFiles = data.files || [];
  const dirEl = $("outDir");
  dirEl.textContent = data.dir ? `${data.dir}${data.keep ? ` · хранится до ${data.keep} файлов` : ""}` : "";
  dirEl.hidden = !data.dir;
  renderOutList();
}

async function deleteOutFile(name) {
  if (!confirm(`Удалить файл ${name}?`)) return;
  const r = await fetch(outFileUrl(name), { method: "DELETE" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  if (outAudio.src.includes(encodeURIComponent(name))) { outAudio.pause(); outAudio.removeAttribute("src"); }
  await loadOutFiles();
}

outAudio.addEventListener("play", () => pauseAllPlayback(outAudio));

// ---------- синтез ----------
let timer;
function busy(on, text = "") {
  const btn = $("go");
  btn.setAttribute("aria-busy", String(on));
  btn.innerHTML = on ? `${icon("loader", "spin")}<span>Озвучиваю…</span>` : `${icon("wave")}<span>Озвучить</span>`;
  clearInterval(timer);
  // прогресс-полоса только для долгого — скачивание голоса или сборка RHVoice
  $("progress").hidden = !on || !text;
  if (on && text) {
    $("progressText").textContent = text;
    const t0 = Date.now();
    $("elapsed").textContent = "0:00";
    timer = setInterval(() => { $("elapsed").textContent = fmtTime((Date.now() - t0) / 1000); }, 1000);
  }
}

async function speak() {
  const text = $("text").value.trim(), opt = selectedVoice(), btn = $("go");
  if (!text) { $("text").focus(); return; }
  if (!opt || btn.getAttribute("aria-busy") === "true") return;
  let voice = opt.value, pending = opt.dataset.pending;
  const eng = voice.split(":")[0];
  const firstUse = pending === "download" && FIRST_USE[eng] ? `${FIRST_USE[eng]} — только в первый раз` : "";
  busy(true, firstUse || { build: "Собираю RHVoice из исходников — обычно 1–3 минуты", download: "Скачиваю голос — первый раз может занять до минуты" }[pending] || "");
  $("err").hidden = true;
  try {
    const body = { text, voice, speed: +$("speed").value, format: state.format, lang: "auto" };
    const r = await fetch("/api/synth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    const meta = JSON.parse(r.headers.get("X-LTTS-Meta") || "{}");
    const blob = await r.blob();
    const c = { text, meta, fmt: body.format, url: URL.createObjectURL(blob) };
    clips.unshift(c);
    if (clips.length > 30) disposeClip(clips.pop());
    renderHistory();
    switchMainTab("history");
    c.audio.volume = gainVolume;
    c.audio.play().catch(() => {});
    c.peaks = await peaksFor(blob);
    drawWave(c);
    if (pending) load();
  } catch (e) {
    $("err").innerHTML = `${icon("alert")}<span></span>`;
    $("err").querySelector("span").textContent = e.message;
    $("err").hidden = false;
  } finally {
    busy(false);
  }
}

$("go").onclick = speak;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); speak(); } });
$("text").addEventListener("input", () => { updateCount(); updateHint(); });
$("speed").addEventListener("input", () => { $("speedv").textContent = (+$("speed").value).toFixed(2) + "×"; store.set("speed", +$("speed").value); });
$("speed").value = store.get("speed", 1); $("speedv").textContent = (+$("speed").value).toFixed(2) + "×";
const showErr = (e) => { $("err").innerHTML = `${icon("alert")}<span></span>`; $("err").querySelector("span").textContent = e.message; $("err").hidden = false; };
$("clearHistory").onclick = clearHistory;
$("refreshOut").onclick = () => loadOutFiles().catch(showErr);
$("clearOut").onclick = () => clearOutAll().catch(showErr);
setGain(gainVolume);
$("volume").addEventListener("input", (e) => setGain(+e.target.value / 100));
updateCount(); updateHint(); renderHistory();
Promise.all([load(), loadOutFiles()]).catch((e) => { $("err").innerHTML = `${icon("alert")}<span>Сервер недоступен: ${e.message}</span>`; $("err").hidden = false; });
fetch("/api/settings")
  .then((r) => r.json())
  .then((s) => lttsMountAgentsPanel($("agents-mount"), lttsAgentContextFromSettings(s)))
  .catch(() => lttsMountAgentsPanel($("agents-mount"), { serverUrl: location.origin, windows: /Win/i.test(navigator.userAgent) }));
</script>
</body>
