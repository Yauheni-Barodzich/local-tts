<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ltts — первый запуск</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #475569;
    --accent: #2563EB; --ok: #15803D; --bad: #B91C1C; --font: "Segoe UI", system-ui, sans-serif;
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font: 16px/1.5 var(--font); color: var(--text); }
  .card { width: min(420px, 92vw); padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .bar { height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; margin: 16px 0; }
  .bar > span { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 4px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { width: 85%; } }
  .state { font-size: 14px; color: var(--muted); }
  .err { color: var(--bad); margin-top: 12px; }
  .ok { color: var(--ok); }
</style>
</head>
<body>
<div class="card">
  <h1>Подготовка ltts</h1>
  <p>Скачиваем голос по умолчанию (Silero, kseniya). Остальные голоса — в <a href="/settings">настройках</a>.</p>
  <div class="bar" id="progress"><span></span></div>
  <div class="state" id="state">Запуск…</div>
  <div class="err" id="err" hidden></div>
</div>
<script>
async function tick() {
  let r = await fetch("/api/status").then((x) => x.json());
  let s = r.desktop_setup || {};
  const el = document.getElementById("state");
  const err = document.getElementById("err");
  const bar = document.getElementById("progress");
  if (s.complete || s.state === "done") {
    el.textContent = "Готово";
    el.className = "state ok";
    bar.hidden = true;
    setTimeout(() => { location.href = "/"; }, 600);
    return;
  }
  if (s.state === "error") {
    err.hidden = false;
    err.textContent = s.error || "Ошибка загрузки";
    bar.hidden = true;
    el.textContent = "Повтор через 5 с…";
    setTimeout(() => fetch("/api/setup/minimal", { method: "POST" }), 5000);
    return;
  }
  if (s.state === "idle" && s.needed) {
    await fetch("/api/setup/minimal", { method: "POST" });
  }
  el.textContent = s.current ? `Загрузка ${s.current}…` : "Загрузка…";
  setTimeout(tick, 800);
}
fetch("/api/setup/minimal", { method: "POST" }).finally(tick);
</script>
</body>
</html>
